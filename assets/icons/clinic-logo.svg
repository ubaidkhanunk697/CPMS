<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <path d="M60 8 L104 26 C104 70 60 108 60 108 C60 108 16 70 16 26 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
  <path d="M60 14 L98 30 C98 68 60 101 60 101 C60 101 22 68 22 30 Z" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Red Cross with Payment Symbol Overlay -->
  <rect x="52" y="34" width="16" height="42" rx="4" fill="#EF4444" />
  <rect x="39" y="47" width="42" height="16" rx="4" fill="#EF4444" />
  
  <!-- Center Accent node -->
  <circle cx="60" cy="55" r="5" fill="#FFFFFF" />
  
  <!-- Currency / Calculation badge ring -->
  <circle cx="84" cy="84" r="16" fill="#EF4444" stroke="#0B1220" stroke-width="3"/>
  <text x="84" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">₨</text>
</svg>
